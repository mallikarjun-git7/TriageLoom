name: TriageLoom CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-checks:
    name: Tests, TypeScript and Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/triageloom_ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-for-production-123456
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Generate Next.js types
        run: npx next typegen

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Check production build
        run: npm run build
